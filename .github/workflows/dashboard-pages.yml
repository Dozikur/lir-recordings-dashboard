name: Publish Dashboard

on:
  workflow_dispatch:
    inputs:
      sync_data:
        description: "Obnovit data ze Soundcharts API"
        required: true
        default: false
        type: boolean
      soundcloud_only:
        description: "Doplnit jen SoundCloud plays z posledni cache"
        required: true
        default: false
        type: boolean
      check_usage:
        description: "Zkontrolovat Soundcharts API quota bez syncu"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create private env
        if: ${{ inputs.sync_data || inputs.soundcloud_only || inputs.check_usage }}
        run: |
          {
            echo "SOUNDCHARTS_APP_ID=${{ secrets.SOUNDCHARTS_APP_ID }}"
            echo "SOUNDCHARTS_API_KEY=${{ secrets.SOUNDCHARTS_API_KEY }}"
            echo "SOUNDCHARTS_BASE_URL=https://customer.api.soundcharts.com"
            echo "SOUNDCLOUD_CLIENT_ID=${{ secrets.SOUNDCLOUD_CLIENT_ID }}"
            echo "SOUNDCLOUD_CLIENT_SECRET=${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}"
            echo "SOUNDCLOUD_PROFILE_URL=https://soundcloud.com/let-it-roll-recordings"
          } > .env

      - name: Check Soundcharts usage
        if: ${{ inputs.check_usage }}
        run: npm run usage:soundcharts

      - name: Sync Soundcharts cache
        if: ${{ inputs.sync_data && !inputs.soundcloud_only }}
        run: npm run sync

      - name: Reuse current published cache
        if: ${{ !inputs.sync_data || inputs.soundcloud_only }}
        run: |
          mkdir -p data
          curl --fail --location --silent --show-error \
            "https://dozikur.github.io/lir-recordings-dashboard/data/cache.json?design=${{ github.run_id }}" \
            --output data/cache.json

      - name: Enrich SoundCloud cache
        if: ${{ inputs.soundcloud_only }}
        run: npm run sync:soundcloud

      - name: Build static dashboard
        run: |
          mkdir -p site/data
          cp public/* site/
          cp data/catalog.json site/data/catalog.json
          cp data/cache.json site/data/cache.json
          if [ -f data/external-insights.json ]; then
            cp data/external-insights.json site/data/external-insights.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
